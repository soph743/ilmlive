{% extends "base.html" %}

{% block title %}Sign up · ilm live{% endblock %}

{% block content %}
  <h1>Create an account</h1>
  <form method="post">
    <label>
      Email
      <input type="email" name="email" value="{{ email or '' }}" required>
    </label>
    <label>
      Password
      <input type="password" name="password" minlength="6" required>
    </label>
    <fieldset>
      <legend>I am a</legend>
      <label>
        <input type="radio" name="role" value="viewer" {% if role != 'streamer' %}checked{% endif %}>
        Viewer
      </label>
      <label>
        <input type="radio" name="role" value="streamer" {% if role == 'streamer' %}checked{% endif %}>
        Streamer
      </label>
    </fieldset>
    <button type="submit">Sign up</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
