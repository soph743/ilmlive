{% extends "base.html" %}

{% block title %}Log in · ilm live{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post">
    <label>
      Email
      <input type="email" name="email" value="{{ email or '' }}" required>
    </label>
    <label>
      Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
{% endblock %}
